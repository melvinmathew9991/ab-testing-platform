# Local parity with the deployed services. Same images, same environment
# variables, different values.
services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: ab-api:local
    ports:
      - "8000:8080"
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      LOG_FORMAT: text
      MAX_UPLOAD_MB: "25"
      MAX_ROWS: "1000000"
      CORS_ORIGINS: "http://localhost:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
