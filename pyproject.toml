[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abtest"
version = "1.0.0"
description = "A small, opinionated toolkit for analysing A/B tests, with a worked example on a public dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Jinja2>=3.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "httpx>=0.27",          # FastAPI TestClient transport
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2",
]

[project.scripts]
abtest = "abtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abtest*"]

[tool.setuptools.package-data]
abtest = ["py.typed", "reporting/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: calibration runs that simulate many experiments",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "analysis", "services/api"]

[tool.ruff.lint]
# E/F: correctness and style, I: import order, B: likely bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures for their side effect of being in scope, and the
# analysis script sets sys.path before importing the package.
"tests/*" = ["E501"]
"analysis/*" = ["E402"]
# The API test fixtures put the service on sys.path before importing it.
"tests/api/*" = ["E402", "E501"]
# Depends() and File() in argument defaults is the FastAPI dependency-injection
# idiom, not the mutable-default bug B008 exists to catch.
"services/api/app/routers/*" = ["B008"]
