[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abtest"
version = "1.0.0"
description = "A small, opinionated toolkit for analysing A/B tests, with a worked example on a public dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Jinja2>=3.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
abtest = "abtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abtest*"]

[tool.setuptools.package-data]
abtest = ["py.typed", "reporting/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: calibration runs that simulate many experiments",
]

[tool.black]
line-length = 100
target-version = ["py310"]
